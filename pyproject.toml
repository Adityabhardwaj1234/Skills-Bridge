[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbridge"
version = "2.0.1"
description = "Dynamic Skill, MCP-Server, and Agent-Extension Orchestration & Intelligence Layer for Coding Agents (Hermes, OpenCode, Claude Code)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SkillBridge Architecture Team"}
]
keywords = ["ai-agents", "skills", "mcp", "opencode", "claude-code", "hermes-agent", "security", "orchestration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
mcp = [
    "mcp>=1.0.0",
]
monitoring = [
    "psutil>=5.9",
]

[project.scripts]
skillbridge = "skillbridge.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillbridge*"]

[tool.setuptools.package-data]
skillbridge = ["data/**/*"]
